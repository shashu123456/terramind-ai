services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-in-production}
      MYSQL_DATABASE: terramind
      MYSQL_USER: terramind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-terramind}
    volumes:
      - terramind_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-in-production}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://terramind:${MYSQL_PASSWORD:-terramind}@db:3306/terramind
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LLM_PROVIDER: local
    ports:
      - "3000:3000"

volumes:
  terramind_mysql: